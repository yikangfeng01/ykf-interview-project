<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>签字页生成系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            margin: 0;
        }
        body.login-page {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            padding: 40px;
            width: 100%;
            max-width: 420px;
            min-height: 360px;
        }
        .container.wide { max-width: 800px; }
        h1 { color: #1a1a2e; font-size: 24px; margin-bottom: 8px; }
        .subtitle { text-align: center; color: #888; font-size: 14px; margin-bottom: 32px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 14px; font-weight: 600; color: #333; margin-bottom: 6px; }
        input, select {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.2s;
            outline: none;
        }
        input:focus, select:focus { border-color: #4361ee; }
        button {
            padding: 12px 24px;
            background: #4361ee;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #3a56d4; }
        button:disabled { background: #a0b4f0; cursor: not-allowed; }
        .btn-block { width: 100%; margin-top: 8px; }
        .btn-danger { background: #d63031; }
        .btn-danger:hover { background: #b71c1c; }
        .btn-sm { padding: 8px 16px; font-size: 13px; }
        .btn-outline {
            background: #fff; color: #4361ee; border: 1.5px solid #4361ee;
        }
        .btn-outline:hover { background: #f0f4ff; }
        .btn-icon {
            background: none; border: none; cursor: pointer;
            padding: 6px; border-radius: 6px; display: flex;
            align-items: center; justify-content: center;
            transition: background 0.2s; color: #888;
        }
        .btn-icon:hover { background: #f0f0f0; color: #d63031; }
        .btn-icon svg { width: 20px; height: 20px; }
        .error-msg {
            background: #fff0f0; color: #d63031;
            padding: 10px 16px; border-radius: 6px;
            font-size: 14px; margin-bottom: 16px; display: none;
        }
        .error-msg.show { display: block; }
        .success-msg {
            background: #f0fff4; color: #00b894;
            padding: 10px 16px; border-radius: 6px;
            font-size: 14px; margin-bottom: 16px; display: none;
        }
        .success-msg.show { display: block; }
        .loading { text-align: center; color: #888; padding: 40px 0; }

        /* Header Bar */
        .header-bar {
            display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 10px;
        }
        .header-bar h1 { margin: 0; }
        .header-actions { display: flex; gap: 10px; }

        /* Back Link */
        .back-link {
            display: inline-block; margin-bottom: 16px;
            color: #4361ee; cursor: pointer; font-size: 14px;
        }
        .back-link:hover { text-decoration: underline; }

        /* Project Table */
        .table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .project-table { width: 100%; border-collapse: collapse; min-width: 600px; }
        .project-table th {
            padding: 12px 16px; text-align: left; font-size: 13px; font-weight: 600;
            color: #888; border-bottom: 2px solid #eee; white-space: nowrap;
        }
        .project-table th:nth-child(4) { text-align: center; }
        .project-table td { padding: 14px 16px; border-bottom: 1px solid #f0f0f0; font-size: 14px; color: #1a1a2e; }
        .project-table td:nth-child(4) { text-align: center; color: #888; font-size: 13px; white-space: nowrap; }
        .project-table tbody tr { cursor: pointer; transition: background 0.2s; }
        .project-table tbody tr:hover { background: #f8f9ff; }
        .project-name { font-weight: 600; color: #1a1a2e; }
        .project-desc { font-size: 13px; color: #999; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 300px; }
        .action-links { display: flex; gap: 10px; white-space: nowrap; }
        .action-links a { color: #4361ee; cursor: pointer; font-size: 13px; text-decoration: none; }
        .action-links a:hover { text-decoration: underline; color: #3a56d4; }
        .action-links a.danger { color: #d63031; }
        .action-links a.danger:hover { color: #b71c1c; }
        .action-links .btn-link {
            background: none; border: none; color: #4361ee; cursor: pointer;
            font-size: 13px; padding: 2px 4px; text-decoration: none;
        }
        .action-links .btn-link:hover { text-decoration: underline; }
        .action-links .btn-link.disabled { color: #ccc; cursor: not-allowed; pointer-events: none; text-decoration: none; }
        .status-badge {
            padding: 3px 12px; border-radius: 12px;
            font-size: 12px; font-weight: 600; white-space: nowrap;
        }
        .status-draft { background: #dfe6e9; color: #636e72; }
        .status-template_selected { background: #74b9ff; color: #fff; }
        .status-variables_filled { background: #fdcb6e; color: #333; }
        .status-generated { background: #00b894; color: #fff; }
        .empty-state { text-align: center; padding: 60px 20px; color: #888; }
        .empty-state p { margin-bottom: 20px; font-size: 15px; }

        /* Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); display: none;
            align-items: center; justify-content: center; z-index: 1000;
        }
        .modal-overlay.show { display: flex; }
        .modal {
            background: #fff; border-radius: 12px; padding: 32px;
            width: 90%; max-width: 420px;
        }
        .modal h3 { margin-bottom: 16px; }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .modal-actions button { flex: 1; }

        /* Template Grid */
        .template-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px; margin-top: 16px;
        }
        .template-card {
            border: 2px solid #eee; border-radius: 10px; padding: 20px;
            cursor: pointer; transition: all 0.2s; text-align: center;
        }
        .template-card:hover { border-color: #4361ee; transform: translateY(-2px); }
        .template-card h4 { margin-bottom: 8px; color: #1a1a2e; font-size: 15px; }
        .template-card .cat { font-size: 12px; color: #888; margin-bottom: 6px; }
        .filter-bar { display: flex; gap: 8px; margin: 16px 0; flex-wrap: wrap; }
        .filter-btn {
            padding: 6px 16px; border: 1.5px solid #ddd; border-radius: 20px;
            font-size: 13px; cursor: pointer; background: #fff;
            transition: all 0.2s; color: #636e72;
        }
        .filter-btn.active { background: #4361ee; color: #fff; border-color: #4361ee; }

        /* Project Detail */
        .project-desc-block { padding: 12px 16px; background: #f8f9fa; border-radius: 8px; margin-bottom: 16px; color: #555; font-size: 14px; line-height: 1.6; white-space: pre-wrap; }
        .detail-row { padding: 12px 0; border-bottom: 1px solid #f0f0f0; }
        .detail-label { font-size: 13px; color: #888; margin-bottom: 4px; }
        .detail-value { font-size: 15px; color: #1a1a2e; }

        /* Template Management Table */
        .tmpl-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
        .tmpl-table th, .tmpl-table td {
            text-align: left; padding: 12px 16px; font-size: 14px;
        }
        .tmpl-table th {
            background: #f8f9fb; color: #636e72; font-weight: 600;
            border-bottom: 2px solid #eee; font-size: 13px;
        }
        .tmpl-table td { border-bottom: 1px solid #f0f0f0; }
        .tmpl-table tr:hover td { background: #f8f9ff; }
        .tmpl-table .actions { display: flex; gap: 8px; white-space: nowrap; }
        .tmpl-table .btn-link {
            background: none; border: none; color: #4361ee; cursor: pointer;
            font-size: 13px; padding: 2px 4px; text-decoration: none;
        }
        .tmpl-table .btn-link:hover { text-decoration: underline; }
        .tmpl-table .btn-link.danger { color: #d63031; }
        .tmpl-table .btn-link.danger:hover { color: #b71c1c; }

        /* Variable Table */
        .var-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
        .var-table th, .var-table td {
            text-align: left; padding: 10px 12px; font-size: 13px;
        }
        .var-table th {
            background: #f8f9fb; color: #636e72; font-weight: 600;
            border-bottom: 2px solid #eee; font-size: 12px;
        }
        .var-table td { border-bottom: 1px solid #f0f0f0; }
        .var-table tr:hover td { background: #f8f9ff; }
        .var-actions { display: flex; gap: 6px; }
        .file-input-wrapper {
            position: relative; overflow: hidden; display: inline-block;
        }
        .file-input-wrapper input[type=file] {
            position: absolute; left: 0; top: 0; width: 100%; height: 100%;
            opacity: 0; cursor: pointer;
        }
        input[type="file"].file-input {
            width: 100%; padding: 10px 12px; border: 1.5px dashed #ddd;
            border-radius: 8px; font-size: 14px; cursor: pointer; background: #fafafa;
        }
        textarea {
            width: 100%; padding: 12px 16px; border: 1.5px solid #ddd;
            border-radius: 8px; font-size: 15px; outline: none; resize: vertical;
            font-family: inherit; min-height: 60px;
        }
        textarea:focus { border-color: #4361ee; }

        /* Shell Layout */
        .topbar {
            height: 56px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 24px; background: #fff;
            border-bottom: 1px solid #e0e0e0; z-index: 10;
        }
        .topbar-brand { display: flex; align-items: center; gap: 10px; }
        .topbar-icon { font-size: 20px; }
        .topbar-title { font-size: 1.5em; font-weight: 700; color: #1a1a2e; }
        .layout { flex: 1; display: flex; overflow: hidden; }
        .sidebar {
            width: 220px; flex-shrink: 0; background: #fafbfc;
            border-right: 1px solid #e0e0e0; padding: 12px 0; overflow-y: auto;
        }
        .sidebar-item {
            padding: 12px 24px; cursor: pointer; font-size: 14px;
            color: #636e72; transition: all 0.15s;
            border-left: 3px solid transparent; user-select: none;
        }
        .sidebar-item:hover { background: #f0f2f5; color: #1a1a2e; }
        .sidebar-item.active {
            background: #eef1ff; color: #4361ee;
            font-weight: 600; border-left-color: #4361ee;
        }
        .content { flex: 1; overflow-y: auto; padding: 24px 32px; background: #f0f2f5; }
    </style>
</head>
<body>
    <div id="app" class="container"></div>

    <script>
    // ============ SPA Router ============
    const appEl = document.getElementById('app');
    let currentToken = localStorage.getItem('token') || '';
    let currentEditId = null;
    let ptvarRowIndex = null;
    const statusLabels = { draft: '草稿', template_selected: '已选模板', variables_filled: '已填变量', generated: '已生成' };

    function navigate(hash) { window.location.hash = hash; }

    function getRoute() {
        const hash = window.location.hash.replace('#', '') || 'login';
        const parts = hash.split('/');
        return { view: parts[0], params: parts.slice(1) };
    }

    async function render(view, params) {
        window.scrollTo(0, 0);
        if (view === 'login') {
            return renderLogin();
        }
        if (!currentToken) { navigate('login'); return; }
        renderShellIfNeeded();
        updateSidebarActive();
        switch (view) {
            case 'home': return renderHome();
            case 'project':
                if (params.length >= 2 && params[1] === 'templates') {
                    if (params.length >= 4 && params[3] === 'variables') {
                        const rowIdx = ptvarRowIndex; ptvarRowIndex = null;
                        return renderProjectTemplateVariables(params[0], params[2], rowIdx || 1);
                    }
                    return renderProjectTemplates(params[0]);
                }
                return renderProjectDetail(params);
            case 'templates': return renderTemplates(params);
            case 'variables': return renderVariables(params);
            case 'public-variables': return renderPublicVariables();
            default: navigate('login');
        }
    }

    window.addEventListener('hashchange', () => {
        const { view, params } = getRoute();
        render(view, params);
    });

    // ============ API Helpers ============
    async function api(method, path, body) {
        const opts = {
            method,
            headers: { 'Content-Type': 'application/json' },
        };
        if (body) opts.body = JSON.stringify(body);
        const res = await fetch(path, opts);
        let data;
        try { data = await res.json(); } catch (e) { data = null; }
        return { status: res.status, data };
    }

    async function apiGet(path) {
        const sep = path.includes('?') ? '&' : '?';
        return api('GET', path + sep + 'token=' + encodeURIComponent(currentToken));
    }

    function apiUrl(p) { return '/api/' + p; }

    // ============ Escape Helpers ============
    function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
    function escAttr(s) { return s.replace(/'/g, "\\'").replace(/"/g, '&quot;'); }

    // ============ Time Helpers ============
    function formatBeijingTime(dbStr) {
        // Database stores Beijing time (Asia/Shanghai timezone), no conversion needed
        if (!dbStr) return '-';
        return dbStr.replace('T', ' ').substring(0, 19);
    }

    // ============ Shell Helpers ============
    function getActiveMenu(hash) {
        const parts = hash.replace('#', '').split('/');
        const view = parts[0];
        if (['home', 'project'].includes(view)) return 'projects';
        if (['templates', 'variables'].includes(view)) return 'templates';
        if (['public-variables'].includes(view)) return 'public-variables';
        return 'projects';
    }

    function updateSidebarActive() {
        const menu = getActiveMenu(window.location.hash);
        document.querySelectorAll('.sidebar-item').forEach(el => {
            el.classList.toggle('active', el.dataset.menu === menu);
        });
    }

    function renderShell() {
        document.body.classList.remove('login-page');
        appEl.style.cssText = '';
        appEl.className = '';
        appEl.innerHTML = `
            <div class="topbar">
                <div class="topbar-brand">
                    <span class="topbar-icon">&#128278;</span>
                    <span class="topbar-title">签字页项目管理系统</span>
                </div>
                <button class="btn-icon" onclick="doLogout()" title="退出登录">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                </button>
            </div>
            <div class="layout">
                <nav class="sidebar" id="sidebar">
                    <div class="sidebar-item active" data-menu="projects" onclick="navigate('home')">项目管理</div>
                    <div class="sidebar-item" data-menu="templates" onclick="navigate('templates')">签字页公共模板管理</div>
                    <div class="sidebar-item" data-menu="public-variables" onclick="navigate('public-variables')">公共变量管理</div>
                </nav>
                <main class="content" id="content-area"></main>
            </div>`;
    }

    function renderShellIfNeeded() {
        if (document.getElementById('content-area')) return;
        renderShell();
    }

    // ============ View: Login ============
    async function renderLogin() {
        document.body.classList.add('login-page');
        if (currentToken) {
            const { status } = await api('POST', apiUrl('verify'), { token: currentToken });
            if (status === 200) { navigate('home'); return; }
            currentToken = ''; localStorage.removeItem('token');
        }

        appEl.className = 'container';
        appEl.innerHTML = `
            <h1 style="text-align:center;">签字页生成系统</h1>
            <p class="subtitle">请登录以继续</p>
            <div id="login-error" class="error-msg"></div>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" placeholder="请输入用户名" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" placeholder="请输入密码" required>
                </div>
                <button type="submit" class="btn-block" id="login-btn">登 录</button>
            </form>
        `;

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const errEl = document.getElementById('login-error');
            btn.disabled = true; btn.textContent = '登录中...';
            errEl.classList.remove('show');

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const { status, data } = await api('POST', apiUrl('login'), { username, password });

            btn.disabled = false; btn.textContent = '登 录';

            if (status === 200 && data.token) {
                currentToken = data.token;
                localStorage.setItem('token', currentToken);
                navigate('home');
            } else {
                errEl.textContent = (data && data.error) || '登录失败';
                errEl.classList.add('show');
            }
        });
    }

    // ============ View: Home ============
    async function renderHome() {
        const contentEl = document.getElementById('content-area');
        contentEl.innerHTML = `
            <div class="header-bar">
                <h1>我的项目</h1>
                <div class="header-actions">
                    <button class="btn-sm btn-outline" onclick="showNewProjectModal()">+ 新建项目</button>
                </div>
            </div>
            <div id="project-list-container"><p class="loading">加载中...</p></div>

            <!-- New Project Modal -->
            <div id="new-project-modal" class="modal-overlay">
                <div class="modal">
                    <h3>新建项目</h3>
                    <div class="form-group">
                        <label for="new-project-name">项目名称</label>
                        <input type="text" id="new-project-name" placeholder="例如：IPO-2026-001" required>
                    </div>
                    <div class="form-group">
                        <label for="new-project-desc">项目描述（可选）</label>
                        <textarea id="new-project-desc" placeholder="简要描述项目内容" rows="3"></textarea>
                    </div>
                    <p id="new-project-error" class="error-msg"></p>
                    <div class="modal-actions">
                        <button class="btn-outline" onclick="closeNewProjectModal()">取消</button>
                        <button id="create-project-btn" onclick="createProject()">创建</button>
                    </div>
                </div>
            </div>

            <!-- Edit Project Modal -->
            <div id="edit-modal" class="modal-overlay">
                <div class="modal">
                    <h3>编辑项目</h3>
                    <div class="form-group">
                        <label for="edit-name">项目名称</label>
                        <input id="edit-name" placeholder="输入项目名称" />
                    </div>
                    <div class="form-group">
                        <label for="edit-desc">描述（可选）</label>
                        <textarea id="edit-desc" placeholder="输入简短描述" rows="3"></textarea>
                    </div>
                    <p id="edit-error" class="error-msg"></p>
                    <div class="modal-actions">
                        <button class="btn-outline" onclick="closeEditModal()">取消</button>
                        <button onclick="saveEdit(currentEditId)">保存</button>
                    </div>
                </div>
            </div>

            <!-- Bind Public Variable Modal -->
            <div id="bind-public-var-modal" class="modal-overlay">
                <div class="modal" style="max-width: 700px;">
                    <h3>绑定公共变量</h3>
                    <p style="color:#666;margin-bottom:12px;">勾选公共变量（可多选），确认后将批量创建对应的模板变量：</p>
                    <div style="max-height: 350px; overflow: auto; border: 1px solid #e0e0e0; border-radius: 6px;">
                        <table style="width:100%;border-collapse:collapse;white-space:nowrap;">
                            <thead>
                                <tr style="background:#f5f6fa;">
                                    <th style="padding:10px 12px;text-align:left;border-bottom:2px solid #e0e0e0;width:50px;">选择</th>
                                    <th style="padding:10px 12px;text-align:left;border-bottom:2px solid #e0e0e0;">名称</th>
                                    <th style="padding:10px 12px;text-align:left;border-bottom:2px solid #e0e0e0;">变量值</th>
                                    <th style="padding:10px 12px;text-align:left;border-bottom:2px solid #e0e0e0;">类型</th>
                                </tr>
                            </thead>
                            <tbody id="bind-public-var-list"><tr><td colspan="4" style="padding:12px;"><p class="loading">加载中...</p></td></tr></tbody>
                        </table>
                    </div>
                    <div style="margin-top:8px;">
                        <label><input type="checkbox" id="bind-pv-select-all" onchange="toggleAllPublicVars(this.checked)"> 全选/取消全选</label>
                    </div>
                    <p id="bind-public-var-error" class="error-msg"></p>
                    <div id="bind-public-var-result" class="success-msg" style="display:none;"></div>
                    <div class="modal-actions">
                        <button class="btn-outline" onclick="closeBindPublicVarModal()">取消</button>
                        <button id="bind-public-var-confirm-btn" onclick="doBindPublicVars()">确认绑定</button>
                    </div>
                </div>
            </div>

            <!-- Bind Public Templates Modal -->
            <div id="ptmpl-bind-modal" class="modal-overlay">
                <div class="modal" style="max-width: 800px;">
                    <h3>绑定公共模板</h3>
                    <p style="color:#666;margin-bottom:12px;">选择要绑定到当前项目的公共模板（含签字变量将一并复制）：</p>
                    <div style="max-height: 350px; overflow: auto; border: 1px solid #e0e0e0; border-radius: 6px;">
                        <table style="width:100%;border-collapse:collapse;white-space:nowrap;">
                            <thead>
                                <tr style="background:#f5f6fa;">
                                    <th style="padding:10px 12px;text-align:left;border-bottom:2px solid #e0e0e0;">选择</th>
                                    <th style="padding:10px 12px;text-align:left;border-bottom:2px solid #e0e0e0;">模板名称</th>
                                    <th style="padding:10px 12px;text-align:left;border-bottom:2px solid #e0e0e0;">分类</th>
                                    <th style="padding:10px 12px;text-align:left;border-bottom:2px solid #e0e0e0;">描述</th>
                                </tr>
                            </thead>
                            <tbody id="ptmpl-bind-list"><tr><td colspan="4" style="padding:12px;"><p class="loading">加载中...</p></td></tr></tbody>
                        </table>
                    </div>

    async function createProject() {
        const name = document.getElementById('new-project-name').value.trim();
        const descEl = document.getElementById('new-project-desc');
        const description = descEl ? descEl.value.trim() : '';
        const errEl = document.getElementById('new-project-error');
        if (!name) {
            errEl.textContent = '请输入项目名称';
            errEl.classList.add('show');
            return;
        }

        const payload = { token: currentToken, name };
        if (description) payload.description = description;
        const { status, data } = await api('POST', apiUrl('projects'), payload);

        if (status === 201) {
            closeNewProjectModal();
            await loadProjects();

            errEl.textContent = (data && data.error) || '创建失败';

    async function uploadProjectTemplate(projectId) {
        const name = document.getElementById('ptmpl-upload-name').value.trim();
        const category = document.getElementById('ptmpl-upload-cat').value.trim();
        const description = document.getElementById('ptmpl-upload-desc').value.trim();
        const fileInput = document.getElementById('ptmpl-upload-file');
        const errorEl = document.getElementById('ptmpl-upload-error');
        const btn = document.getElementById('ptmpl-upload-btn');

        if (!name) { errorEl.textContent = '请输入模板名称'; errorEl.classList.add('show'); return; }
        if (!category) { errorEl.textContent = '请输入分类'; errorEl.classList.add('show'); return; }
        if (!fileInput.files || fileInput.files.length === 0) { errorEl.textContent = '请选择 DOCX 文件'; errorEl.classList.add('show'); return; }

        btn.disabled = true;
        btn.textContent = '上传中...';
        errorEl.classList.remove('show');

        const fd = new FormData();
        fd.append('name', name);
        fd.append('category', category);
        fd.append('description', description);
        fd.append('file', fileInput.files[0]);

        const { status, data } = await apiMultipart('POST', apiUrl('projects/' + projectId + '/templates'), fd);
        btn.disabled = false;
        btn.textContent = '上传';

        if (status === 201) {
            closeProjectUploadTemplateModal();
            await loadProjectTemplates(projectId);
        } else {
            errorEl.textContent = (data && data.error) || '上传失败';
            errorEl.classList.add('show');
        }
    }

        const description = document.getElementById('ptmpl-edit-desc').value.trim();

        const projectId = getCurrentProjectIdFromHash();
        const { status, data } = await api('PUT', apiUrl('projects/' + projectId + '/templates/' + ptmplCurrentEditId),

    async function confirmBindTemplates() {
        const selected = Array.from(document.querySelectorAll('.ptmpl-bind-cb'))
            .filter(cb => cb.checked)
            .map(cb => parseInt(cb.value));

        const errorEl = document.getElementById('ptmpl-bind-error');
        errorEl.classList.remove('show');

        if (selected.length === 0) {
            errorEl.textContent = '请至少选择一个模板';
            errorEl.classList.add('show');
            return;
        }

        const btn = document.getElementById('ptmpl-bind-confirm-btn');
        btn.disabled = true;

        const { status, data } = await api('POST',
            apiUrl('projects/' + ptmplBindProjectId + '/templates/bind'),
            { token: currentToken, template_ids: selected });

        btn.disabled = false;
        btn.textContent = '确认绑定';

        if (status === 201 && data) {
            const pid = ptmplBindProjectId;
            closeProjectBindTemplateModal();
            const boundCnt = (data.bound || []).length;
            const skippedCnt = (data.skipped || []).length;
            let msg = '绑定完成：';
            if (boundCnt > 0) msg += '成功 ' + boundCnt + ' 个';
            if (skippedCnt > 0) msg += (boundCnt > 0 ? '，跳过 ' : '跳过 ') + skippedCnt + ' 个已存在';

            await loadProjectTemplates(pid);
        } else {
            errorEl.textContent = (data && data.error) || '绑定失败，请重试';
            errorEl.classList.add('show');
        }
    }

    async function saveProjectVariable() {
        const pid = ptvarCurrentProjectId;
        const tid = ptvarCurrentTemplateId;
        const name = document.getElementById('ptvar-name').value.trim();
        const varType = document.getElementById('ptvar-type').value;
        const page = parseInt(document.getElementById('ptvar-page').value) || 1;
        const x = parseFloat(document.getElementById('ptvar-x').value) || 0;
        const y = parseFloat(document.getElementById('ptvar-y').value) || 0;
        const width = parseFloat(document.getElementById('ptvar-w').value) || 120;
        const height = parseFloat(document.getElementById('ptvar-h').value) || 40;
        const fontSize = parseInt(document.getElementById('ptvar-fontsize').value) || 12;
        const fontColor = document.getElementById('ptvar-fontcolor').value;
        const errorEl = document.getElementById('ptvar-modal-error');

        if (!name) { errorEl.textContent = '请输入变量名称'; errorEl.classList.add('show'); return; }

        if (ptvarCurrentMode === 'add') {
            const { status, data } = await api('POST', apiUrl('projects/' + pid + '/templates/' + tid + '/variables'),
                { token: currentToken, name, value: document.getElementById('ptvar-value').value.substring(0, 1024), var_type: varType, page, x, y, width, height, font_size: fontSize, font_color: fontColor });
            if (status === 201) {
                closeProjectVarModal();
                await loadProjectVariables(pid, tid);
            } else {
                errorEl.textContent = (data && data.error) || '创建失败';
                errorEl.classList.add('show');
            }
        } else {
            const { status, data } = await api('PUT', apiUrl('projects/' + pid + '/templates/' + tid + '/variables/' + ptvarCurrentEditId),
                { token: currentToken, name, value: document.getElementById('ptvar-value').value.substring(0, 1024), var_type: varType, page, x, y, width, height, font_size: fontSize, font_color: fontColor });
            if (status === 200) {
                closeProjectVarModal();
                await loadProjectVariables(pid, tid);
            } else {
                errorEl.textContent = (data && data.error) || '更新失败';
                errorEl.classList.add('show');
            }
        }
    }

    async function deleteProjectVariable(variableId, name) {
        if (!confirm('确定要删除变量「' + name + '」吗？')) return;
        const pid = ptvarCurrentProjectId;
        const tid = ptvarCurrentTemplateId;
        const { status } = await api('DELETE', apiUrl('projects/' + pid + '/templates/' + tid + '/variables/' + variableId), { token: currentToken });
        if (status === 204) {
            await loadProjectVariables(pid, tid);
        } else {
            const errorEl = document.getElementById('ptvar-error');
            errorEl.textContent = '删除失败';
            errorEl.classList.add('show');
        }
    }

    async function importProjectVariables(projectId, templateId) {
        const fileInput = document.getElementById('ptvar-import-file');
        if (!fileInput.files || fileInput.files.length === 0) return;

        const fd = new FormData();
        fd.append('file', fileInput.files[0]);

        const { status, data } = await apiMultipart('POST', apiUrl('projects/' + projectId + '/templates/' + templateId + '/variables/import'), fd);
        if (status === 200) {
            const msg = '导入完成：' + data.imported + ' 条成功' + (data.errors && data.errors.length > 0 ? '，' + data.errors.length + ' 条失败' : '');
            alert(msg);
            await loadProjectVariables(projectId, templateId);
        } else {
            const errorEl = document.getElementById('ptvar-error');
            errorEl.textContent = (data && data.error) || '导入失败';
            errorEl.classList.add('show');
        }
        fileInput.value = '';
    }

    // ============ Project Template Variable: Bind Public Variables ============
    async function showProjectBindPublicVarModal(projectId, templateId) {
        var modal = document.getElementById('bind-public-var-modal');
        var listEl = document.getElementById('bind-public-var-list');
        var errEl = document.getElementById('bind-public-var-error');
        var resultEl = document.getElementById('bind-public-var-result');
        errEl.classList.remove('show');
        resultEl.style.display = 'none';
        listEl.innerHTML = '<tr><td colspan="4" style="padding:12px;"><p class="loading">加载中...</p></td></tr>';
        modal.classList.add('show');

        // Switch confirm button to project-scoped handler
        var confirmBtn = document.getElementById('bind-public-var-confirm-btn');
        if (confirmBtn) {
            confirmBtn.setAttribute('onclick', 'doProjectBindPublicVars()');
        }

        var pvRes, tvRes;
        try {
            var res = await Promise.all([
                apiGet(apiUrl('public-variables')),
                apiGet(apiUrl('projects/' + projectId + '/templates/' + templateId + '/variables'))
            ]);
            pvRes = res[0];
            tvRes = res[1];
        } catch (e) {
            listEl.innerHTML = '<tr><td colspan="4" style="padding:12px;"><p class="loading">加载失败</p></td></tr>';
            return;
        }

        if (pvRes.status !== 200 || !Array.isArray(pvRes.data)) {
            listEl.innerHTML = '<tr><td colspan="4" style="padding:12px;"><p class="loading">加载公共变量失败</p></td></tr>';
            return;
        }
        if (pvRes.data.length === 0) {
            listEl.innerHTML = '<tr><td colspan="4" style="padding:12px;"><p>暂无公共变量，请先在左侧菜单「公共变量管理」中创建</p></td></tr>';
            return;
        }

        var boundIds = new Set();
        if (tvRes.status === 200 && Array.isArray(tvRes.data)) {
            tvRes.data.forEach(function(v) {
                if (v.public_variables_id) boundIds.add(v.public_variables_id);
            });
        }

        window._bindVarProjectId = projectId;
        window._bindVarTemplateId = templateId;
        window._bindVarBoundIds = boundIds;

        // Reset master checkboxes
        var masters = document.querySelectorAll('#bind-pv-select-all');
        for (var k = 0; k < masters.length; k++) {
            masters[k].checked = false;
        }

        listEl.innerHTML = pvRes.data.map(function(v) {
            var isBound = boundIds.has(v.id);
            return '<tr>' +
'<td><input type="checkbox" class="bind-pv-checkbox" value="' + v.id + '" data-name="' + escAttr(v.name) + '" data-value="' + escAttr(v.value) + '" data-type="' + escAttr(v.var_type) + '" data-page="' + v.page + '" data-x="' + v.x + '" data-y="' + v.y + '" data-width="' + v.width + '" data-height="' + v.height + '" data-font-size="' + v.font_size + '" data-font-color="' + escAttr(v.font_color) + '" data-required="' + v.required + '"' + (isBound ? ' disabled' : '') + '></td>' +
            '<td><strong>' + esc(v.name) + '</strong>' + (isBound ? ' <span style="color:#999;font-size:12px;">(已绑定)</span>' : '') + '</td>' +
            '<td style="max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="' + escAttr(v.value || '') + '">' + esc((v.value || '').substring(0, 15)) + '</td>' +
            '<td>' + esc(v.var_type) + '</td>' +
            '</tr>';
        }).join('');
    }

    async function doProjectBindPublicVars() {
        var projectId = window._bindVarProjectId;
        var templateId = window._bindVarTemplateId;
        var boundIds = window._bindVarBoundIds || new Set();
        var errEl = document.getElementById('bind-public-var-error');
        var resultEl = document.getElementById('bind-public-var-result');
        var btn = document.getElementById('bind-public-var-confirm-btn');

        errEl.classList.remove('show');
        resultEl.style.display = 'none';

        var checkboxes = document.querySelectorAll('.bind-pv-checkbox:checked:not([disabled])');
        if (checkboxes.length === 0) {
            errEl.textContent = '请至少勾选一个公共变量';
            errEl.classList.add('show');
            return;
        }

        btn.disabled = true;
        btn.textContent = '绑定中...';

        var created = 0, skipped = 0;
        var skippedReasons = [];
        var boundIdsNow = new Set(boundIds);

        for (var i = 0; i < checkboxes.length; i++) {
            var cb = checkboxes[i];
            var pvId = parseInt(cb.value);

            if (boundIdsNow.has(pvId)) {
                skipped++;
                skippedReasons.push('「' + cb.dataset.name + '」已在此模板中绑定');
                continue;
            }
            boundIdsNow.add(pvId);

            var payload = {
                token: currentToken,
                name: cb.dataset.name,
                value: cb.dataset.value || '',
                var_type: cb.dataset.type,
                page: parseInt(cb.dataset.page) || 1,
                required: cb.dataset.required === 'true',
                x: parseFloat(cb.dataset.x) || 0,
                y: parseFloat(cb.dataset.y) || 0,
                width: parseFloat(cb.dataset.width) || 120,
                height: parseFloat(cb.dataset.height) || 40,
                font_size: parseInt(cb.dataset.fontSize) || 12,
                font_color: cb.dataset.fontColor || '#000000',
                public_variables_id: pvId
            };

            var res = await api('POST', apiUrl('projects/' + projectId + '/templates/' + templateId + '/variables'), payload);
            if (res.status === 201) {
                created++;
            } else {
                skipped++;
                skippedReasons.push('「' + cb.dataset.name + '」创建失败');
            }
        }

        btn.disabled = false;
        btn.textContent = '确认绑定';

        var msg = '批量绑定完成：成功 ' + created + ' 个';
        if (skipped > 0) {
            msg += '，跳过 ' + skipped + ' 个';
        }
        if (skippedReasons.length > 0) {
            msg += '<br><small>' + skippedReasons.join('; ') + '</small>';
        }
        resultEl.innerHTML = msg;
        resultEl.style.display = 'block';

        loadProjectVariables(projectId, templateId);
    }

    // ============ Multipart API Helper ============
    async function apiMultipart(method, path, formData) {
        formData.append('token', currentToken);
        const opts = { method, body: formData };
        const res = await fetch(path, opts);
        let data;
        try { data = await res.json(); } catch (e) { data = null; }
        return { status: res.status, data };

    async function apiDownload(path) {
        path += (path.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(currentToken);
        const res = await fetch(path);
        if (!res.ok) throw new Error('Download failed');
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'variables_import_template.xlsx';
        a.click();
        URL.revokeObjectURL(url);
    }

    function closeUploadModal() {

    async function uploadTemplate() {
        const name = document.getElementById('tmpl-name').value.trim();
        const category = document.getElementById('tmpl-category').value.trim();
        const description = document.getElementById('tmpl-desc').value.trim();
        const fileInput = document.getElementById('tmpl-file');
        const errEl = document.getElementById('upload-error');
        const btn = document.getElementById('upload-btn');

        if (!name) { errEl.textContent = '请输入模板名称'; errEl.classList.add('show'); return; }
        if (!category) { errEl.textContent = '请输入分类'; errEl.classList.add('show'); return; }
        if (!fileInput.files || fileInput.files.length === 0) {
            errEl.textContent = '请选择 DOCX 文件'; errEl.classList.add('show'); return;
        }

        btn.disabled = true; btn.textContent = '上传中...';
        errEl.classList.remove('show');

        const fd = new FormData();
        fd.append('name', name);
        fd.append('category', category);
        fd.append('description', description);
        fd.append('file', fileInput.files[0]);

        const { status, data } = await apiMultipart('POST', apiUrl('templates'), fd);

        btn.disabled = false; btn.textContent = '上传';

        if (status === 201) {
            closeUploadModal();
            await loadTemplatesList();
        } else {
            errEl.textContent = (data && data.error) || '上传失败';
            errEl.classList.add('show');
        }
    }

        }
    }

    async function loadVariables(templateId) {

        if (status !== 200 || !Array.isArray(data)) {

            return;

            container.innerHTML = '<div class="empty-state"><p>暂无签字变量</p></div>';
            return;

        container.innerHTML = `

                <tr>

                    <td style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${escAttr(v.value || '')}">${esc((v.value || '').substring(0, 20) + ((v.value || '').length > 20 ? '...' : ''))}</td>

                            ? '<button class="btn-link" disabled title="公共变量不能直接修改，请在公共变量管理中修改">编辑</button>'
                            : `<button class="btn-link" onclick="showEditVarModal(${v.id}, '${escAttr(v.name)}', '${escAttr(v.var_type)}', ${v.page}, ${v.x}, ${v.y}, ${v.width}, ${v.height}, ${v.font_size}, '${escAttr(v.font_color)}', ${v.required}, '${escAttr(v.value || '')}', ${v.public_variables_id || 0})">编辑</button>`

        // Also update template info

    async function showBindPublicVarModal(templateId) {
        const modal = document.getElementById('bind-public-var-modal');
        const listEl = document.getElementById('bind-public-var-list');
        const errEl = document.getElementById('bind-public-var-error');
        const resultEl = document.getElementById('bind-public-var-result');
        errEl.classList.remove('show');
        resultEl.style.display = 'none';
        listEl.innerHTML = '<tr><td colspan="4" style="padding:12px;"><p class="loading">加载中...</p></td></tr>';
        modal.classList.add('show');

        // Reset confirm button to template-scoped handler
        var confirmBtn = document.getElementById('bind-public-var-confirm-btn');
        if (confirmBtn) {
            confirmBtn.setAttribute('onclick', 'doBindPublicVars()');
        }

        // Fetch public variables and existing template variables in parallel
        const [pvRes, tvRes] = await Promise.all([
            apiGet(apiUrl('public-variables')),
            apiGet(apiUrl('templates/' + templateId + '/variables'))
        ]);

        if (pvRes.status !== 200 || !Array.isArray(pvRes.data)) {
            listEl.innerHTML = '<tr><td colspan="4" style="padding:12px;"><p class="loading">加载公共变量失败</p></td></tr>';
            return;
        }
        if (pvRes.data.length === 0) {
            listEl.innerHTML = '<tr><td colspan="4" style="padding:12px;"><p>暂无公共变量，请先在左侧菜单「公共变量管理」中创建</p></td></tr>';
            return;
        }

        // Collect already-bound public_variables_ids in this template
        const boundIds = new Set();
        if (tvRes.status === 200 && Array.isArray(tvRes.data)) {
            tvRes.data.forEach(function(v) {
                if (v.public_variables_id) boundIds.add(v.public_variables_id);
            });
        }

        window._bindVarTemplateId = templateId;
        window._bindVarBoundIds = boundIds;

        // Reset master checkboxes
        var masters = document.querySelectorAll('#bind-pv-select-all');
        for (var k = 0; k < masters.length; k++) {
            masters[k].checked = false;
        }

        listEl.innerHTML = pvRes.data.map(function(v) {
            var isBound = boundIds.has(v.id);
            return '<tr>' +
                '<td><input type="checkbox" class="bind-pv-checkbox" value="' + v.id + '" data-name="' + escAttr(v.name) + '" data-value="' + escAttr(v.value) + '" data-type="' + escAttr(v.var_type) + '" data-page="' + v.page + '" data-x="' + v.x + '" data-y="' + v.y + '" data-width="' + v.width + '" data-height="' + v.height + '" data-font-size="' + v.font_size + '" data-font-color="' + escAttr(v.font_color) + '" data-required="' + v.required + '"' + (isBound ? ' disabled' : '') + '></td>' +
                '<td><strong>' + esc(v.name) + '</strong>' + (isBound ? ' <span style="color:#999;font-size:12px;">(已绑定)</span>' : '') + '</td>' +
                '<td style="max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="' + escAttr(v.value || '') + '">' + esc((v.value || '').substring(0, 15)) + '</td>' +
                '<td>' + esc(v.var_type) + '</td>' +
                '</tr>';
        }).join('');
    }

    async function doBindPublicVars() {
        var templateId = window._bindVarTemplateId;
        var boundIds = window._bindVarBoundIds || new Set();
        var errEl = document.getElementById('bind-public-var-error');
        var resultEl = document.getElementById('bind-public-var-result');
        var btn = document.getElementById('bind-public-var-confirm-btn');

        errEl.classList.remove('show');
        resultEl.style.display = 'none';

        var checkboxes = document.querySelectorAll('.bind-pv-checkbox:checked:not([disabled])');
        if (checkboxes.length === 0) {
            errEl.textContent = '请至少勾选一个公共变量';
            errEl.classList.add('show');
            return;
        }

        btn.disabled = true;
        btn.textContent = '绑定中...';

        var created = 0, skipped = 0;
        var skippedReasons = [];
        var boundIdsNow = new Set(boundIds);

        for (var i = 0; i < checkboxes.length; i++) {
            var cb = checkboxes[i];
            var pvId = parseInt(cb.value);

            // Check for duplicate within this template (already-bound check)
            if (boundIdsNow.has(pvId)) {
                skipped++;
                skippedReasons.push('「' + cb.dataset.name + '」已在此模板中绑定');
                continue;
            }
            boundIdsNow.add(pvId);

            var payload = {
                token: currentToken,
                name: cb.dataset.name,
                value: cb.dataset.value || '',
                var_type: cb.dataset.type,
                page: parseInt(cb.dataset.page) || 1,
                required: cb.dataset.required === 'true',
                x: parseFloat(cb.dataset.x) || 0,
                y: parseFloat(cb.dataset.y) || 0,
                width: parseFloat(cb.dataset.width) || 120,
                height: parseFloat(cb.dataset.height) || 40,
                font_size: parseInt(cb.dataset.fontSize) || 12,
                font_color: cb.dataset.fontColor || '#000000',
                public_variables_id: pvId
            };

            var res = await api('POST', apiUrl('templates/' + templateId + '/variables'), payload);
            if (res.status === 201) {
                created++;
            } else {
                skipped++;
                skippedReasons.push('「' + cb.dataset.name + '」创建失败');
            }
        }

        btn.disabled = false;
        btn.textContent = '确认绑定';

        // Show result
        var msg = '批量绑定完成：成功 ' + created + ' 个';
        if (skipped > 0) {
            msg += '，跳过 ' + skipped + ' 个';
        }
        if (skippedReasons.length > 0) {
            msg += '<br><small>' + skippedReasons.join('; ') + '</small>';
        }
        resultEl.innerHTML = msg;
        resultEl.style.display = 'block';

        // Reload variable list
        await loadVariables(templateId);
        closeBindPublicVars();
    }

        fd.append('file', fileInput.files[0]);

        const { status, data } = await apiMultipart('POST', apiUrl('public-variables/import'), fd);

        btn.disabled = false; btn.textContent = '导入';

        if (status === 200) {
            successEl.textContent = '导入成功：' + data.imported + ' 条';
            if (data.errors && data.errors.length > 0) {
                successEl.textContent += '，' + data.errors.length + ' 条失败';
                console.warn('Import errors:', data.errors);
            }
            successEl.classList.add('show');
            await loadPublicVariables();
        } else {
            errEl.textContent = (data && data.error) || '导入失败';
            errEl.classList.add('show');
        }
    }

    async function downloadPublicVarTemplate() {
        try {
            await apiDownload(apiUrl('public-variables/import-template'));
        } catch (e) {
            const container = document.getElementById('pv-msg');
            if (container) {
                container.innerHTML = '<p class="error-msg show">下载模板失败</p>';
            }
        }
    }

    // ============ Boot ============
    (async function boot() {
        const { view, params } = getRoute();
        await render(view, params);
    })();
    </script>
</body>
</html>
